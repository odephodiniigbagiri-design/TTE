<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTE Classroom</title>
<script>
window.TTE_OK=false;
function tteMsg(t){var a=document.getElementById('app');if(a&&!window.TTE_OK)a.innerHTML='<div style="padding:1.5rem;max-width:640px"><h2>The classroom could not start</h2><p>'+t+'</p><p>File version: TTE-CLASSROOM-7. The uploaded classroom.html may be incomplete; it should end with &lt;/html&gt;.</p></div>'}
addEventListener('error',function(e){tteMsg('Error: '+(e.message||'unknown'))});
setTimeout(function(){if(!window.TTE_OK)tteMsg('The page script did not finish loading.')},1500);
</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#4a5572;--card:#f2f6fe;--line:#d3dcf1;--night:#071a45;--blue:#1646b8;--sun:#f6b400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}}
:root[data-theme="dark"]{--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}
html{background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 'Newsreader',Georgia,serif;min-height:100vh}
h2,h3,nav,label,.btn,.tag,.tabs button,.wk{font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif}
h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 .5em;font-weight:800}
h3{margin:1.2em 0 .4em}
.wrap{max-width:960px;margin:0 auto;padding:0 1.2rem}
header.top{background:var(--night);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.7rem 1.2rem}
.brand{display:flex;align-items:center;gap:.6rem;color:#fff;text-decoration:none;font:800 clamp(.95rem,4vw,1.3rem) 'Bricolage Grotesque',sans-serif;text-transform:uppercase;letter-spacing:.05em;line-height:1.15}
.brand img{height:40px;width:auto;border-radius:6px}.brand small{display:block;font:italic 500 .72rem 'Newsreader',Georgia,serif;letter-spacing:.12em;color:var(--sun);text-transform:none}

header.top nav a{color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:.4rem 1rem;border-radius:8px;font:700 .95rem 'Bricolage Grotesque',sans-serif}
header.top nav a:hover{background:var(--sun);border-color:var(--sun);color:#000}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
section.b{padding:2.2rem 0}
.btn{display:inline-block;background:var(--sun);color:#000;border:2px solid var(--sun);padding:.6rem 1.2rem;border-radius:8px;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:inherit;border-color:currentColor}
.btn.s{padding:.3rem .8rem;font-size:.9rem}
form{display:grid;gap:.9rem;max-width:620px}
label{display:grid;gap:.25rem;font-weight:500;font-size:.95rem}
input,select,textarea{font:1rem 'Newsreader',Georgia,serif;padding:.6rem;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.note{background:var(--card);border-left:5px solid var(--sun);padding:.7rem 1rem;max-width:68ch}
.tag{background:var(--card);border:1px solid var(--line);padding:.1rem .6rem;border-radius:99px;font-size:.8rem}
.tag.ok{background:var(--sun);color:#000;border-color:var(--sun)}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
.tabs button{background:var(--card);color:var(--fg);border:1.5px solid var(--line);padding:.45rem .9rem;border-radius:6px;font-weight:600;font-size:.95rem;cursor:pointer}
.tabs button.on{background:var(--sun);color:#000}
.av{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--night);color:var(--sun);font:700 1.1rem 'Bricolage Grotesque',sans-serif;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:2.4rem}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#8a93a8;border:2px solid var(--bg)}
.big .dot{width:20px;height:20px}
.dot.on{background:#1fa84f}
.prof{display:flex;gap:1.2rem;align-items:center;margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--line)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.5rem;margin:1rem 0}
.wk{padding:.5rem .3rem;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:.85rem;cursor:pointer}
.wk.op{background:var(--blue);color:#fff;border-color:var(--blue)}
.wk.cur{outline:3px solid var(--sun)}
.cm{display:flex;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
video{display:block;width:100%;max-width:860px;border-radius:10px;background:#000}
.yt{aspect-ratio:16/9;max-width:860px}.yt iframe{width:100%;height:100%;border:0;border-radius:10px}
details{margin-top:.4rem}summary{cursor:pointer;font-weight:700;text-decoration:underline}details p{margin:.5rem 0;white-space:pre-wrap}.row>div:first-child{flex:1;min-width:240px}
footer{background:var(--night);color:#fff;padding:1.4rem 0;font-size:.95rem}
/* slide-in menu */
.brand{flex:1;min-width:0}
header.top{position:relative;flex-wrap:nowrap}
.mb{position:relative;z-index:60;margin-left:auto;flex:none;width:46px;height:46px;border-radius:8px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);display:grid;place-content:center;gap:5px;cursor:pointer;transition:background .25s,border-color .25s}
.mb span{display:block;width:22px;height:3px;border-radius:2px;background:#fff;transition:transform .35s cubic-bezier(.22,.8,.3,1),opacity .2s,background .25s}
header.open .mb{background:var(--sun);border-color:var(--sun)}
header.open .mb span{background:#000}
header.open .mb span:nth-child(1){transform:translateY(8px) rotate(45deg)}
header.open .mb span:nth-child(2){opacity:0}
header.open .mb span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
header.top nav{position:fixed;top:0;right:0;bottom:0;z-index:50;width:clamp(230px,50vw,380px);display:flex;flex-direction:column;gap:.7rem;padding:calc(env(safe-area-inset-top,0px) + 84px) 1.2rem 1.5rem;margin:0;border-left:4px solid var(--sun);background:radial-gradient(circle at 20% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 78% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 35% 62%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 85%,#fff 0 1.5px,transparent 2px),linear-gradient(180deg,#0d2f78,#071a45 70%);box-shadow:-18px 0 40px rgba(0,0,0,.45);transform:translateX(100%);visibility:hidden;overflow-y:auto;transition:transform .4s cubic-bezier(.22,.8,.3,1),visibility 0s .4s}
header.open.top nav{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.22,.8,.3,1),visibility 0s}
header.top nav a{display:block;text-align:center;padding:.85rem 1rem;font-size:1.05rem;opacity:0;transform:translateX(30px);transition:opacity .3s,transform .4s cubic-bezier(.22,.8,.3,1),background .15s}
header.open.top nav a{opacity:1;transform:none}
header.open.top nav a:nth-child(1){transition-delay:.12s}
header.open.top nav a:nth-child(2){transition-delay:.18s}
header.open.top nav a:nth-child(3){transition-delay:.24s}
header.open.top nav a:nth-child(4){transition-delay:.3s}
header.open.top nav a:nth-child(5){transition-delay:.36s}
header.open.top nav a:nth-child(6){transition-delay:.42s}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
html.navopen .scrim{opacity:1;visibility:visible;transition:opacity .35s}
html.navopen{overflow:hidden}
@media(prefers-reduced-motion:reduce){header.top nav,header.top nav a,.scrim,.mb span{transition:none!important}}
</style></head><body>

function cmt(){const l=D.com[SES[cs][0]+'-'+cw]||[];return l.map(c=>{const a=usr(c.u);return `<div class="cm">${av(a)}<div><b>${esc(a.name)}</b> <small>${new Date(c.at).toLocaleString()}</small><br>${esc(c.t)}</div></div>`}).join('')||'<p>No comments yet. Be the first.</p>'}
function wkPanel(){if(!cw)return '<p>Choose a week to begin.</p>';const s=SES[cs][0],w=wk(s,cw);if(!w.open&&!isAd())return '<p class="note">This week is locked until the facilitator releases it.</p>';
return `<h3>${SES[cs][1]}, Week ${cw}${w.title?': '+esc(w.title):''}</h3>${vid(w.video)}${isAd()?`<form onsubmit="saveW(event)"><label>Lesson title<input name="title" value="${esc(w.title)}"></label><label>Video link (mp4 or YouTube)<input name="video" value="${esc(w.video)}"></label><label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" name="open" style="width:auto"${w.open?' checked':''}>Released to students</label><button class="btn s">Save week</button></form>`:''}<h3>Comments and chat</h3><div id="cmt">${cmt()}</div><form onsubmit="post(event)"><textarea name="t" rows="2" placeholder="Write a comment…" required></textarea><button class="btn s">Post</button></form>`}
const appl=u=>`<details><summary>View application</summary>${F.filter(f=>f[0]!=='_h').map(f=>`<p><b>${f[1]}</b><br>${esc(u[f[0]])||'-'}</p>`).join('')}<p><b>Signed</b><br>${esc(u.signature)||'-'}, ${esc(u.signdate)||'-'}</p></details>`;
function roster(){const l=D.users.filter(u=>u.status!=='removed');return `<p><b>${l.filter(on).length}</b> online now, ${l.length} registered.</p>`+(l.map(u=>`<div class="row"><div style="display:flex;gap:.7rem;align-items:center">${av(u)}<div><b>${esc(u.name)}</b> <span class="tag${u.status==='admitted'?' ok':''}">${u.status}</span><br><small>${esc(u.email)}, ${esc(u.country)}, ${esc(u.tz)}</small><br>${appl(u)}</div></div><div>${u.status==='admitted'?'':`<button class="btn s" onclick="setS('${u.id}','admitted')">Admit</button> `}<button class="btn s o" onclick="setS('${u.id}','removed')">Remove</button></div></div>`).join('')||'<p>No registrations yet.</p>')}
const tForm=u=>{const l=(D.tests||[]).filter(x=>x.u===u.id).reverse();return `<h3>Share a testimonial</h3><form onsubmit="sendT(event)"><label>Tell the admin about your experience with TTE<textarea name="t" rows="4" maxlength="1000" required></textarea></label><button class="btn">Send to admin</button></form><div id="tm"></div>${l.length?'<h3>Your testimonials</h3>'+l.map(x=>`<div class="cm"><div><small>${new Date(x.at).toLocaleString()}</small><br><span style="white-space:pre-wrap">${esc(x.t)}</span></div></div>`).join(''):''}`};
function tests(){return (D.tests||[]).slice().reverse().map(x=>{const a=usr(x.u);return `<div class="cm">${av(a)}<div style="flex:1"><b>${esc(a.name)}</b> <small>${new Date(x.at).toLocaleString()}</small> ${x.read?'':'<span class="tag ok">New</span>'}<br><span style="white-space:pre-wrap">${esc(x.t)}</span><br><button class="btn s o" onclick="markT(${x.id})">${x.read?'Mark as new':'Mark as read'}</button></div></div>`}).join('')||'<p>No testimonials yet.</p>'}
const R={
register:()=>`<section class="b"><div class="wrap"><h2>Register</h2><p class="note">For now, accounts are saved on this device only. The shared online system comes next.</p><form onsubmit="reg(event)">${F.map(f=>fld(f,'')).join('')}${tzs()}${COMMIT}<label>Create a password (8+ characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn">Create my account</button></form><div id="m"></div></div></section>`,
login:()=>`<section class="b"><div class="wrap"><h2>Sign in</h2>${/^#(dashboard|classroom)$/.test(location.hash)?`<p class="note">Please sign in to open your ${location.hash==='#classroom'?'classroom':'dashboard'}.</p>`:''}<form onsubmit="login(event)"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button></form><div id="m"></div><p>New here? <a href="#register">Register</a></p></div></section>`,
dashboard:()=>{const u=cur(),ok=u.status==='admitted';return `<section class="b"><div class="wrap"><div class="prof">${av(u,1)}<div><h2 style="margin:0">${esc(u.name)}</h2><span class="tag${ok?' ok':''}">${ok?'Admitted':'Waiting for admission'}</span> <span class="tag">TTE BASICS</span><br><label class="btn s o" style="display:inline-block;margin-top:.6rem;cursor:pointer">Change photo<input type="file" accept="image/*" hidden onchange="pic(this)"></label></div></div>${ok?meetBox(u)+'<p><a class="btn" href="#classroom">Enter the classroom</a></p>':'<p class="note">The classroom opens once the admin admits you. You can edit your details meanwhile.</p><p><span class="btn o" style="opacity:.55;cursor:not-allowed">Classroom opens after admission</span></p>'}${tForm(u)}<h3>My details</h3><form onsubmit="saveP(event)">${F.filter(f=>f[0]!=='email').map(f=>fld(f,u[f[0]])).join('')}<label>Email<input value="${esc(u.email)}" disabled></label>${tzs(u.tz)}<button class="btn">Save changes</button></form>${u.signature?`<p class="note">Commitment signed by ${esc(u.signature)} on ${esc(u.signdate)}.</p>`:''}<div id="m"></div></div></section>`},
classroom:()=>{const u=cur();if(!isAd()&&u.status!=='admitted')return '<section class="b"><div class="wrap"><h2>Classroom</h2><p class="note">The classroom is locked until the admin admits you.</p><p><a class="btn" href="#dashboard">Back to my dashboard</a></p></div></section>';return `<section class="b"><div class="wrap"><h2>Classroom</h2><p><a class="btn s o" href="#${isAd()?'admin':'dashboard'}">← ${isAd()?'Roster':'My dashboard'}</a></p>${meetBox(u)}<div class="tabs">${SES.map((s,i)=>`<button class="${cs===i?'on':''}" onclick="cs=${i};cw=0;draw()">${s[1]}</button>`).join('')}</div><div class="weeks" id="grid">${grid()}</div><div id="wp">${wkPanel()}</div></div></section>`},
admin:()=>`<section class="b"><div class="wrap"><h2>Admin</h2><div class="tabs"><button class="${at==='r'?'on':''}" onclick="at='r';draw()">Roster</button><button class="${at==='m'?'on':''}" onclick="at='m';draw()">Live class</button><button class="${at==='t'?'on':''}" onclick="at='t';draw()">Testimonials${(n=>n?` (${n})`:'')((D.tests||[]).filter(x=>!x.read).length)}</button></div>${at==='t'?'<div id="tests">'+tests()+'</div>':at==='r'?'<div id="roster">'+roster()+'</div>':`<form onsubmit="saveM(event)"><label>Google Meet link<input type="url" name="link" value="${esc(D.meet.link)}" required></label><label>Class date and time (your local time)<input type="datetime-local" name="at"></label><button class="btn">Save live class</button></form><p>Students see the time in their own time zone. Open weeks in the Classroom tab.</p><div id="m"></div>`}</div></section>`};
const NV=()=>'<a href="index.html">Home</a>'+(ME?'':'<a href="#register">Register</a>')+'<a href="index.html#sponsor">Sponsor</a>'+(isAd()?'<a href="#admin">Roster</a>':'<a href="#dashboard">Dashboard</a>')+'<a href="#classroom">Classroom</a>'+(ME?'<a href="#" onclick="logout();return false">Sign out</a>':'<a href="#login">Sign in</a>');
function draw(){D=load()||D;let r=location.hash.slice(1);if(ME&&!cur())setMe(null);
if(!ME)r=r==='register'?r:'login';else if(!R[r]||r==='login'||r==='register'||(r==='admin'&&!isAd())||(r==='dashboard'&&isAd()))r=isAd()?'admin':'dashboard';
$('#nv').innerHTML=NV();app.innerHTML=R[r]();$('#ft').innerHTML=`<b>Contact</b><br>Phone: ${esc(CFG.phone)}<br>WhatsApp: ${esc(CFG.whatsapp)}<br>Email: ${esc(CFG.email)}`}
const route=()=>{draw();scrollTo(0,0)};
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};
async function reg(e){e.preventDefault();D=load()||D;const o=Object.fromEntries(new FormData(e.target)),m=$('#m'),em=o.email.trim().toLowerCase();if(D.users.some(u=>u.email.toLowerCase()===em)||em===CFG.adminEmail.toLowerCase()){m.innerHTML='<p class="note">This email is already registered. Please sign in.</p>';return}
const pw=o.password;delete o.password;o.email=em;o.id='u'+Date.now();o.pw=await H(pw);o.status='pending';o.photo='';o.lastSeen=Date.now();upd(()=>{D.users.push(o)});setMe(o.id);go('dashboard')}
async function login(e){e.preventDefault();D=load()||D;const o=Object.fromEntries(new FormData(e.target)),m=$('#m'),em=o.email.trim().toLowerCase();
if(em===CFG.adminEmail.toLowerCase()&&o.password===CFG.adminPass){setMe('admin');upd(()=>{D.adminSeen=Date.now()});go(location.hash==='#classroom'?'classroom':'admin');return}
const u=D.users.find(u=>u.email===em&&u.status!=='removed');if(!u||u.pw!==await H(o.password)){m.innerHTML='<p class="note">Email or password is not correct.</p>';return}
setMe(u.id);upd(()=>{cur().lastSeen=Date.now()});go(location.hash==='#classroom'?'classroom':'dashboard')}
function logout(){upd(()=>{if(isAd())D.adminSeen=0;else if(cur())cur().lastSeen=0});setMe(null);go('login')}
function saveP(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));upd(()=>Object.assign(cur(),o));draw();$('#m').innerHTML='<p class="note">Details saved.</p>'}
function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);const d=c.toDataURL('image/jpeg',.8);upd(()=>{cur().photo=d});draw()};im.src=r.result};r.readAsDataURL(f)}
function saveW(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),k=SES[cs][0]+'-'+cw;upd(()=>{D.weeks[k]={title:o.title,video:o.video,open:!!o.open}});draw()}
function post(e){e.preventDefault();const t=new FormData(e.target).get('t').trim();if(!t)return;const k=SES[cs][0]+'-'+cw;upd(()=>{(D.com[k]=D.com[k]||[]).push({u:ME,t,at:Date.now()})});e.target.reset();$('#cmt').innerHTML=cmt()}
function sendT(e){e.preventDefault();const t=new FormData(e.target).get('t').trim();if(!t)return;upd(()=>{(D.tests=D.tests||[]).push({id:Date.now(),u:ME,t,at:Date.now(),read:false})});draw();$('#tm').innerHTML='<p class="note">Thank you. Your testimonial has been sent to the admin.</p>'}
function markT(id){upd(()=>{const x=D.tests.find(x=>x.id===id);x.read=!x.read});draw()}
function saveM(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));upd(()=>{D.meet={link:o.link,at:o.at?new Date(o.at).toISOString():D.meet.at}});$('#m').innerHTML='<p class="note">Live class saved. Students can now see the link.</p>'}
function setS(id,s){upd(()=>{D.users.find(u=>u.id===id).status=s});$('#roster').innerHTML=roster()}
const refresh=()=>{const p={cmt:()=>cw?cmt():'',roster,grid,tests};for(const id in p){const el=$('#'+id);if(el)el.innerHTML=p[id]()}};
const beat=()=>{if(ME)upd(()=>{const u=cur();if(!u)return;if(isAd())D.adminSeen=Date.now();else u.lastSeen=Date.now()})};
addEventListener('hashchange',route);
addEventListener('storage',e=>{if(e.key==='tte-class'){D=load()||D;refresh()}});
setInterval(()=>{beat();D=load()||D;refresh()},15000);
beat();route();
{const mb=document.getElementById('mb'),hd=mb.parentElement,rt=document.documentElement;const set=o=>{hd.classList.toggle('open',o);rt.classList.toggle('navopen',o);mb.setAttribute('aria-expanded',o);mb.setAttribute('aria-label',o?'Close menu':'Open menu')};mb.onclick=()=>set(!hd.classList.contains('open'));document.getElementById('sc').onclick=()=>set(false);document.getElementById('nv').addEventListener('click',e=>{if(e.target.closest('a'))set(false)});addEventListener('keydown',e=>{if(e.key==='Escape')set(false)})}
window.TTE_OK=true;
</script></body></html>
