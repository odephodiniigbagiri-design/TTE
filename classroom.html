<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTE Classroom</title>
<script>
window.TTE_OK=false;
function tteMsg(t){var a=document.getElementById('app');if(a&&!window.TTE_OK)a.innerHTML='<div style="padding:1.5rem;max-width:640px"><h2>The classroom could not start</h2><p>'+t+'</p><p>File version: TTE-CLASSROOM-12. The uploaded classroom.html may be incomplete; it should end with &lt;/html&gt;.</p></div>'}
addEventListener('error',function(e){tteMsg('Error: '+(e.message||'unknown'))});
setTimeout(function(){if(!window.TTE_OK)tteMsg('The page script did not finish loading.')},1500);
</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="liveboard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#4a5572;--card:#f2f6fe;--line:#d3dcf1;--night:#071a45;--blue:#1646b8;--sun:#f6b400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}}
:root[data-theme="dark"]{--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}
html{background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 'Newsreader',Georgia,serif;min-height:100vh}
h2,h3,nav,label,.btn,.tag,.tabs button,.wk{font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif}
h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 .5em;font-weight:800}
h3{margin:1.2em 0 .4em}
.wrap{max-width:960px;margin:0 auto;padding:0 1.2rem}
header.top{background:var(--night);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.7rem 1.2rem}
.brand{display:flex;align-items:center;gap:.6rem;color:#fff;text-decoration:none;font:800 clamp(.95rem,4vw,1.3rem) 'Bricolage Grotesque',sans-serif;text-transform:uppercase;letter-spacing:.05em;line-height:1.15}
.brand img{height:40px;width:auto;border-radius:6px}.brand small{display:block;font:italic 500 .72rem 'Newsreader',Georgia,serif;letter-spacing:.12em;color:var(--sun);text-transform:none}

header.top nav a{color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:.4rem 1rem;border-radius:8px;font:700 .95rem 'Bricolage Grotesque',sans-serif}
header.top nav a:hover{background:var(--sun);border-color:var(--sun);color:#000}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
section.b{padding:2.2rem 0}
.btn{display:inline-block;background:var(--sun);color:#000;border:2px solid var(--sun);padding:.6rem 1.2rem;border-radius:8px;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:inherit;border-color:currentColor}
.btn.s{padding:.3rem .8rem;font-size:.9rem}
form{display:grid;gap:.9rem;max-width:620px}
label{display:grid;gap:.25rem;font-weight:500;font-size:.95rem}
input,select,textarea{font:1rem 'Newsreader',Georgia,serif;padding:.6rem;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.note{background:var(--card);border-left:5px solid var(--sun);padding:.7rem 1rem;max-width:68ch}
.tag{background:var(--card);border:1px solid var(--line);padding:.1rem .6rem;border-radius:99px;font-size:.8rem}
.tag.ok{background:var(--sun);color:#000;border-color:var(--sun)}
.tabs{display:flex;gap:0;margin:1rem 0 1.2rem;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;color:var(--fg);border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:.7rem 1rem;border-radius:0;font-weight:600;font-size:.95rem;cursor:pointer;white-space:nowrap}
.tabs button.on{background:transparent;color:var(--fg);border-bottom-color:var(--sun)}
.av{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--night);color:var(--sun);font:700 1.1rem 'Bricolage Grotesque',sans-serif;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:2.4rem}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#8a93a8;border:2px solid var(--bg)}
.big .dot{width:20px;height:20px}
.dot.on{background:#1fa84f}
.prof{display:flex;gap:1.2rem;align-items:center;margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--line)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.5rem;margin:1rem 0}
.wk{padding:.5rem .3rem;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:.85rem;cursor:pointer}
.wk.op{background:var(--blue);color:#fff;border-color:var(--blue)}
.wk.cur{outline:3px solid var(--sun)}
.cm{display:flex;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
video{display:block;width:100%;max-width:860px;border-radius:10px;background:#000}
details.note ol{padding-left:20px;margin:8px 0}
.ah p{margin:.1rem 0 0;opacity:.7}.ah h2{margin-bottom:0}
.bd{background:var(--sun);color:#000;border-radius:999px;padding:.05rem .5rem;font-size:.8rem;margin-left:.35rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.7rem;margin:.6rem 0 1rem}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.stats b{display:block;font-size:1.8rem;line-height:1.1}.stats span{font-size:.85rem;opacity:.7}
.stats .hl{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.rbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.8rem}.rbar input{flex:1 1 220px;width:auto}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:.55rem .95rem;font-weight:600;cursor:pointer}.seg button.on{background:var(--sun);color:#000}
.rc{display:grid;grid-template-columns:1fr auto;gap:.6rem 1rem;align-items:center;padding:.9rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:.6rem;transition:box-shadow .2s}
.rc:hover{box-shadow:0 6px 18px rgba(5,11,31,.12)}.rc details{grid-column:1/-1}
.rm{display:flex;gap:.8rem;align-items:center}.ra{display:flex;gap:.4rem;flex-wrap:wrap}
dialog#md{border:0;border-radius:16px;padding:0;width:calc(100% - 2rem);max-width:540px;background:var(--bg);color:var(--fg);box-shadow:0 24px 60px rgba(5,11,31,.5)}
dialog#md::backdrop{background:rgba(5,11,31,.65)}
.mdc{padding:1.3rem;display:grid;gap:.7rem}.mdc h3{margin:0}.mdc textarea{min-height:11rem}.mact{display:flex;flex-wrap:wrap;gap:.5rem}
@media(max-width:560px){.rc{grid-template-columns:1fr}}
.pres{margin:.2rem 0 1.1rem}.pres:empty{display:none}
.pbar{display:flex;align-items:center;gap:.5rem;font-weight:600}
.pbar .pd{width:.65rem;height:.65rem;border-radius:50%;background:#2fb457;box-shadow:0 0 0 0 rgba(47,180,87,.6);animation:pls 2s infinite}
@keyframes pls{70%{box-shadow:0 0 0 7px rgba(47,180,87,0)}100%{box-shadow:0 0 0 0 rgba(47,180,87,0)}}
.pm{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:.45rem 0 .7rem}.pm i{display:block;height:100%;background:linear-gradient(90deg,#2fb457,var(--sun));border-radius:4px;transition:width .6s ease}
.pl{display:flex;flex-wrap:wrap;gap:.45rem}
.pc{display:inline-flex;align-items:center;gap:.45rem;padding:.25rem .65rem .25rem .3rem;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.9rem}
.pc small{opacity:.65}
.ty{color:var(--blue);font-style:italic}.ty i{font-style:normal;animation:tdot 1.2s infinite}.ty i:nth-child(2){animation-delay:.2s}.ty i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.tag.fac{background:var(--sun);color:#111;margin-left:.3rem}
.q{margin:.3rem 0;padding:.35rem .7rem;border-left:3px solid var(--sun);background:rgba(127,150,210,.12);border-radius:0 8px 8px 0;font-size:.9rem;opacity:.9}
.rb{background:none;border:0;color:var(--blue);font:inherit;font-size:.85rem;cursor:pointer;padding:.2rem 0;text-decoration:underline}
#rto:not(:empty){display:flex;justify-content:space-between;gap:.6rem;align-items:center;margin:.4rem 0}
#tyl{min-height:1.4rem;font-size:.9rem}
@media(prefers-reduced-motion:reduce){.pbar .pd,.ty i{animation:none}}.pw{position:relative;display:block}.pw input{padding-right:3rem}.eye{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);background:none;border:0;font-size:1.25rem;line-height:1;cursor:pointer;padding:.4rem;color:inherit}.yt{aspect-ratio:16/9;max-width:860px}.yt iframe{width:100%;height:100%;border:0;border-radius:10px}
details{margin-top:.4rem}summary{cursor:pointer;font-weight:700;text-decoration:underline}details p{margin:.5rem 0;white-space:pre-wrap}.row>div:first-child{flex:1;min-width:240px}
a.wk{display:block;text-align:center;text-decoration:none}
.lvl{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.8rem;align-items:center;border-left:6px solid var(--blue);padding:1rem;margin:.8rem 0;background:var(--card);color:var(--fg);text-decoration:none;font-size:1rem}
.lvl .n{font:800 2rem 'Bricolage Grotesque',sans-serif;color:var(--sun)}
.lvl b{display:block;font:800 1.15rem 'Bricolage Grotesque',sans-serif}
.lvl:hover,.lvl:focus-visible{border-left-color:var(--sun)}
.drop{display:block;border:2px dashed var(--blue);border-radius:12px;padding:1.4rem;text-align:center;cursor:pointer;background:var(--card);margin:.6rem 0}
.wk.dr{border:2px solid var(--sun)}
.wk small{font-weight:500}
footer{background:var(--night);color:#fff;padding:1.4rem 0;font-size:.95rem}
/* slide-in menu */
.brand{flex:1;min-width:0}
header.top{position:relative;flex-wrap:nowrap}
.mb{position:relative;z-index:60;margin-left:auto;flex:none;width:46px;height:46px;border-radius:8px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);display:grid;place-content:center;gap:5px;cursor:pointer;transition:background .25s,border-color .25s}
.mb span{display:block;width:22px;height:3px;border-radius:2px;background:#fff;transition:transform .35s cubic-bezier(.22,.8,.3,1),opacity .2s,background .25s}
header.open .mb{background:var(--sun);border-color:var(--sun)}
header.open .mb span{background:#000}
header.open .mb span:nth-child(1){transform:translateY(8px) rotate(45deg)}
header.open .mb span:nth-child(2){opacity:0}
header.open .mb span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
header.top nav{position:fixed;top:0;right:0;bottom:0;z-index:50;width:clamp(230px,50vw,380px);display:flex;flex-direction:column;gap:.7rem;padding:calc(env(safe-area-inset-top,0px) + 84px) 1.2rem 1.5rem;margin:0;border-left:4px solid var(--sun);background:radial-gradient(circle at 20% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 78% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 35% 62%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 85%,#fff 0 1.5px,transparent 2px),linear-gradient(180deg,#0d2f78,#071a45 70%);box-shadow:-18px 0 40px rgba(0,0,0,.45);transform:translateX(100%);visibility:hidden;overflow-y:auto;transition:transform .4s cubic-bezier(.22,.8,.3,1),visibility 0s .4s}
header.open.top nav{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.22,.8,.3,1),visibility 0s}
header.top nav a{display:block;text-align:center;padding:.85rem 1rem;font-size:1.05rem;opacity:0;transform:translateX(30px);transition:opacity .3s,transform .4s cubic-bezier(.22,.8,.3,1),background .15s}
header.open.top nav a{opacity:1;transform:none}
header.open.top nav a:nth-child(1){transition-delay:.12s}
header.open.top nav a:nth-child(2){transition-delay:.18s}
header.open.top nav a:nth-child(3){transition-delay:.24s}
header.open.top nav a:nth-child(4){transition-delay:.3s}
header.open.top nav a:nth-child(5){transition-delay:.36s}
header.open.top nav a:nth-child(6){transition-delay:.42s}
header.open.top nav a:nth-child(7){transition-delay:.48s}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
html.navopen .scrim{opacity:1;visibility:visible;transition:opacity .35s}
html.navopen{overflow:hidden}
@media(prefers-reduced-motion:reduce){header.top nav,header.top nav a,.scrim,.mb span{transition:none!important}}

.lt{font-weight:700;letter-spacing:.02em}.lt1{background:#e6f0ff;border-color:#9bb8f0;color:#0d3a99}.lt2{background:#fff3d1;border-color:#f0cf6a;color:#6b4a00}.lt3{background:#e4f6ea;border-color:#86cf9f;color:#0c5a2a}
.pgb{position:relative;height:10px;border-radius:6px;background:var(--line);margin:.5rem 0 .6rem}.pgb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2fb457,var(--sun))}.pgb u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.7;text-decoration:none}.pgb.sm{height:7px;max-width:260px}
.prg{margin:1rem 0}.prg span.t{display:block}
.lvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin:.6rem 0 1rem}
.lvc{display:grid;gap:.15rem;text-align:left;padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}.lvc b{font:800 1rem 'Bricolage Grotesque',sans-serif}.lvc.on{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}.lvc span,.lvc small{opacity:.75}
.lvl.lock{opacity:.55;border-left-color:var(--line);cursor:not-allowed}
.lvpick{display:grid;gap:.5rem}.lp{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}.lp input{width:auto}.lp b{display:block;font:800 1rem 'Bricolage Grotesque',sans-serif}.lp small{opacity:.7}
.dbar{position:sticky;bottom:0;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.6rem .8rem;margin:1rem 0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;z-index:5}.dbar small{opacity:.8}
