<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thought Transformation Education</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#4a5572;--card:#f2f6fe;--line:#d3dcf1;--night:#071a45;--blue:#1646b8;--sun:#f6b400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}}
:root[data-theme="dark"]{--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}
html{background:var(--night);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 'Newsreader',Georgia,serif}
h1,h2,h3,nav,label,th,.btn,.tag{font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif}
h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1.05;margin:.3em 0;font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 .5em;font-weight:700}
h3{margin:.2em 0;font-size:1.1rem}
p{max-width:68ch}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.2rem}
header.top{background:var(--night);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.7rem 1.2rem}
header.top a{color:#fff;text-decoration:none;font-weight:500}
.brand{display:flex;align-items:center;gap:.6rem;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;line-height:1.2}
.brand img{width:38px;height:38px;border-radius:8px}
nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-left:auto}
header.top nav a{border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:.4rem 1rem;border-radius:8px;font:700 .95rem 'Bricolage Grotesque','Trebuchet MS',sans-serif}header.top nav a:hover,header.top nav a:focus-visible{background:var(--sun);border-color:var(--sun);color:#000}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--night);color:#fff;position:relative;overflow:hidden;padding:3.5rem 0 4rem;background-image:radial-gradient(circle at 12% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 70%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 30% 85%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 45%,#fff 0 1px,transparent 2px)}
.hero::before{content:"";position:absolute;right:-25%;top:18%;width:95%;height:90px;border-radius:90px;transform:rotate(-16deg);background:linear-gradient(90deg,transparent,rgba(246,180,0,.55));filter:blur(3px)}
.hero .wrap{position:relative}
.hero img{width:104px;height:104px;border-radius:16px;border:3px solid #fff}
.motto{font-size:1.25rem;color:var(--sun);margin:0 0 1.4rem}
.btn{display:inline-block;background:var(--sun);color:#000;border:2px solid var(--sun);padding:.65rem 1.2rem;border-radius:8px;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:inherit;border-color:currentColor}
.btn.s{padding:.35rem .8rem;font-size:.9rem}
.hero .btn.o{color:#fff}
section.b{padding:2.8rem 0;border-bottom:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-top:1.4rem}
.facts div{border-top:4px solid var(--sun);padding-top:.5rem}
.facts b{display:block;font:800 2rem 'Bricolage Grotesque',sans-serif;color:var(--blue)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .facts b{color:var(--sun)}}
.stage{display:grid;grid-template-columns:3rem 1fr;gap:.8rem;border-left:6px solid var(--blue);padding:.8rem 1rem;margin:0 0 .9rem;background:var(--card)}
.stage .n{font:800 2rem 'Bricolage Grotesque',sans-serif;color:var(--sun)}
.fac{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem}
.ph{aspect-ratio:1;background:var(--night);border-radius:10px;display:grid;place-items:center;color:var(--sun);font-size:3rem}
.sp{background:var(--night);color:#fff;padding:2.6rem 0}
form{display:grid;gap:.9rem;max-width:620px}
label{display:grid;gap:.25rem;font-weight:500;font-size:.95rem}
input,select,textarea{font:1rem 'Newsreader',Georgia,serif;padding:.6rem;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.note{background:var(--card);border-left:5px solid var(--sun);padding:.7rem 1rem;max-width:68ch}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
.tabs button.on{background:var(--sun);color:#000}
.tabs button{background:var(--card);color:var(--fg);border:1.5px solid var(--line);padding:.45rem .9rem;border-radius:6px;font:600 .95rem 'Bricolage Grotesque',sans-serif;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--line)}
.tag{background:var(--card);border:1px solid var(--line);padding:.1rem .6rem;border-radius:99px;font-size:.8rem}
.tag.ok{background:var(--sun);color:#000;border-color:var(--sun)}
.sc{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
td,th{padding:.5rem .7rem;border-bottom:1px solid var(--line);text-align:left}
pre{white-space:pre-wrap;background:var(--card);padding:.7rem;border-radius:6px;font:.9rem 'Newsreader',serif}
footer{background:var(--night);color:#fff;padding:1.6rem 0;font-size:.95rem}
video{width:100%;max-width:640px;border-radius:8px;background:#000}
</style></head><body>
