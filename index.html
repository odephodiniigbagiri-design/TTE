@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}}
:root[data-theme="dark"]{--bg:#050b1f;--fg:#f4f6fc;--mut:#a9b6d8;--card:#0d1b42;--line:#22356f}
html{background:var(--night);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 'Newsreader',Georgia,serif}
h1,h2,h3,nav,label,th,.btn,.tag{font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif}
h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1.05;margin:.3em 0;font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 .5em;font-weight:700}
h3{margin:.2em 0;font-size:1.1rem}
p{max-width:68ch}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.2rem}
header.top{background:var(--night);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.7rem 1.2rem}
header.top a{color:#fff;text-decoration:none;font-weight:500}
.brand{display:flex;align-items:center;gap:.6rem;font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.brand img{width:38px;height:38px;border-radius:8px}
nav{display:flex;flex-wrap:wrap;gap:1rem;margin-left:auto}
nav a:hover,nav a:focus-visible{color:var(--sun)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--night);color:#fff;position:relative;overflow:hidden;padding:3.5rem 0 4rem;background-image:radial-gradient(circle at 12% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 70%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 30% 85%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 45%,#fff 0 1px,transparent 2px)}
.hero::before{content:"";position:absolute;right:-25%;top:18%;width:95%;height:90px;border-radius:90px;transform:rotate(-16deg);background:linear-gradient(90deg,transparent,rgba(246,180,0,.55));filter:blur(3px)}
.hero .wrap{position:relative}
.hero img{width:104px;height:104px;border-radius:16px;border:3px solid #fff}
.motto{font-size:1.25rem;color:var(--sun);margin:0 0 1.4rem}
.btn{display:inline-block;background:var(--sun);color:#000;border:2px solid var(--sun);padding:.65rem 1.2rem;border-radius:8px;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:inherit;border-color:currentColor}
.btn.s{padding:.35rem .8rem;font-size:.9rem}
.hero .btn.o{color:#fff}
section.b{padding:2.8rem 0;border-bottom:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-top:1.4rem}
.facts div{border-top:4px solid var(--sun);padding-top:.5rem}
.facts b{display:block;font:800 2rem 'Bricolage Grotesque',sans-serif;color:var(--blue)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .facts b{color:var(--sun)}}
.stage{display:grid;grid-template-columns:3rem 1fr;gap:.8rem;border-left:6px solid var(--blue);padding:.8rem 1rem;margin:0 0 .9rem;background:var(--card)}
.stage .n{font:800 2rem 'Bricolage Grotesque',sans-serif;color:var(--sun)}
.fac{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem}
.ph{aspect-ratio:1;background:var(--night);border-radius:10px;display:grid;place-items:center;color:var(--sun);font-size:3rem}
.sp{background:var(--night);color:#fff;padding:2.6rem 0}
form{display:grid;gap:.9rem;max-width:620px}
label{display:grid;gap:.25rem;font-weight:500;font-size:.95rem}
input,select,textarea{font:1rem 'Newsreader',Georgia,serif;padding:.6rem;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.note{background:var(--card);border-left:5px solid var(--sun);padding:.7rem 1rem;max-width:68ch}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
.tabs button.on{background:var(--sun);color:#000}
.tabs button{background:var(--card);color:var(--fg);border:1.5px solid var(--line);padding:.45rem .9rem;border-radius:6px;font:600 .95rem 'Bricolage Grotesque',sans-serif;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--line)}
.tag{background:var(--card);border:1px solid var(--line);padding:.1rem .6rem;border-radius:99px;font-size:.8rem}
.tag.ok{background:var(--sun);color:#000;border-color:var(--sun)}
.sc{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
td,th{padding:.5rem .7rem;border-bottom:1px solid var(--line);text-align:left}
pre{white-space:pre-wrap;background:var(--card);padding:.7rem;border-radius:6px;font:.9rem 'Newsreader',serif}
footer{background:var(--night);color:#fff;padding:1.6rem 0;font-size:.95rem}
video{width:100%;max-width:640px;border-radius:8px;background:#000}

.</h1><p class="motto">${esc(CFG.motto)}</p><a class="btn" href="#register">Register as a trainee</a> <a class="btn o" href="#sponsor">Sponsor this movement</a></div></div>
<section class="b"><div class="wrap"><h2>About</h2><p>Thought Transformation Education is an education system that changes how trainees see life: from seeing difficulties and problems to seeing opportunities. Those opportunities become entrepreneurship, industry and employment that transform society, with the aim of eradicating hunger and poverty and bringing it down by 98% within 46 years.</p><p>We do it through mentorship, commitment, consistency, diversification and replication, with right living.</p></div></section>
<section class="b"><div class="wrap"><h2>Our aim</h2><p>To train individuals and bless them, so that each one returns to bless the system. We aim to establish a business for every 10 trainees, teaching them to see a problem, turn it into an opportunity, and turn that opportunity into a means of income.</p>
<div class="facts"><div><b>Wednesdays</b>live class, 2 hours</div><div><b>40+</b>trainees today</div><div><b>3 × 30</b>weeks, three sessions</div><div><b>70%</b>attendance to move on</div></div>
<p class="note" style="margin-top:1.4rem">Trainees below 70% attendance repeat the session; the rest move to the next stage.</p></div></section>
<section class="b"><div class="wrap"><h2>The three sessions</h2>${STAGES.map((s,i)=>`<div class="stage"><span class="n">${i+1}</span><div><h3>${s[0]}</h3>${s[1]} 30 weeks.</div></div>`).join('')}</div></section>
<section class="b"><div class="wrap"><h2>Facilitators</h2><div class="fac">${CFG.facilitators.map(f=>`<div><div class="ph" aria-label="Photo placeholder">★</div><h3>${esc(f.name)}</h3><p>${esc(f.bio)}</p></div>`).join('')}</div></div></section>
<section class="sp"><div class="wrap"><h2>Be part of this movement</h2><p>Sponsors make it possible for trainees to learn, start businesses and return to bless the system.</p><a class="btn" href="#sponsor">Become a sponsor</a></div></section>`,
register:()=>`<section class="b"><div class="wrap"><h2>Register</h2><p>Fill in the form. The admin will email or message you when you are admitted.</p><form onsubmit="reg(event)">${F.map(inp).join('')}${tzs()}<button class="btn">Submit registration</button></form><div id="rm"></div></div></section>`,
sponsor:()=>`<section class="b"><div class="wrap"><h2>Sponsor the movement</h2><p>Pledge in your own currency. Payments are converted to naira (₦).</p><form id="sp" oninput="np()" onsubmit="pledge(event)"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Currency<select name="cur">${Object.keys(CFG.rates).map(c=>`<option>${c}</option>`).join('')}</select></label><label>Amount<input name="amt" type="number" min="1" step="any" required></label><label>Message (optional)<textarea name="note" rows="2"></textarea></label><p class="note" id="ngn">Naira value will show here.</p><button class="btn">Pledge and continue to payment</button></form><div id="pm"></div></div></section>`,
login:()=>`<section class="b"><div class="wrap"><h2>Sign in</h2><form onsubmit="login(event)"><label>Role<select name="role"><option value="t">Trainee</option><option value="a">Admin</option></select></label><label>Email (trainee)<input name="email" type="email"></label><label>Admin code (admin)<input name="code" type="password"></label><button class="btn">Sign in</button></form><div id="lm"></div><p class="note" style="margin-top:1.4rem">Prototype preview only: <a href="#" onclick="me='d1';go('student');return false">see the trainee area</a> or <a href="#" onclick="me='admin';go('admin');return false">see the admin panel</a>.</p></div></section>`,
student:()=>{const a=S.apps.find(x=>x.id===me);if(!a)return '';const p=pct(a);return `<section class="b"><div class="wrap"><h2>Welcome, ${esc(a.name)}</h2><p class="tag ok">TTE BASICS</p>
<h3>Next class</h3><p>${T(S.cls.at,a.tz)} (${esc(a.tz)})</p>${S.cls.link?`<a class="btn" href="${esc(S.cls.link)}" target="_blank" rel="noopener">Join the live class</a>`:'<p class="note">The class link will be sent to your email and WhatsApp.</p>'}
<h3 style="margin-top:1.6rem">Attendance</h3><p>${p}% of ${S.held.length} classes. ${S.held.length?(p>=70?'You are on track to advance.':'Below 70%: you would repeat this session.'):'No classes recorded yet.'}</p>
<h3>Videos</h3>${S.vids.filter(v=>v.rel).map(v=>`<div style="margin-bottom:1rem"><b>${esc(v.title)}</b><br>${v.url?`<video controls src="${esc(v.url)}"></video>`:'<span class="tag">Video file to be added</span>'}</div>`).join('')||'<p>No videos released yet.</p>'}
<h3>Class summaries</h3>${S.sums.map(s=>`<pre><b>${esc(s.d)}</b>\n${esc(s.t)}</pre>`).join('')||'<p>No summaries yet.</p>'}</div></section>`},
admin:()=>{const tb=[['apps','Applications'],['cls','Class'],['att','Attendance'],['vid','Videos'],['sum','Summaries'],['pl','Pledges']];let h='';
if(tab==='apps')h=S.apps.map(a=>`<div class="row"><div><b>${esc(a.name)}</b> <span class="tag ${a.status==='admitted'?'ok':''}">${a.status}</span><br>${esc(a.email)}, ${esc(a.country)}, ${esc(a.tz)}</div><div>${a.status==='admitted'?'':`<button class="btn s" onclick="adminAct('admit','${a.id}')">Admit</button> `}<button class="btn s o" onclick="adminAct('rem','${a.id}')">Remove</button></div></div>`).join('')||'<p>No applications yet.</p>';
if(tab==='cls')h=`<form onsubmit="setCls(event)"><label>Class date and time (your local time)<input type="datetime-local" name="at" required></label><label>Live class link (Zoom, Meet…)<input type="url" name="link" value="${esc(S.cls.link)}" required></label><button class="btn">Save class</button></form><h3 style="margin-top:1.4rem">Messages, each in the trainee’s own time zone</h3>${adm().map(a=>`<pre>${esc(msg(a))}</pre>`).join('')||'<p>No admitted trainees yet.</p>'}`;
if(tab==='att')h=`<button class="btn s" onclick="adminAct('day')">Record a class day</button><div class="sc"><table><tr><th>Trainee</th>${S.held.map((x,i)=>`<th>W${i+1}</th>`).join('')}<th>%</th><th>Result</th></tr>${adm().map(a=>`<tr><td>${esc(a.name)}</td>${S.held.map(x=>`<td><input type="checkbox" style="width:auto" ${(S.att[x.id]||{})[a.id]?'checked':''} onchange="mark(${x.id},'${a.id}',this.checked)"></td>`).join('')}<td>${pct(a)}%</td><td>${S.held.length?(pct(a)>=70?'Advance':'Repeat'):''}</td></tr>`).join('')}</table></div>`;
if(tab==='vid')h=`<form onsubmit="addVid(event)"><label>Video title<input name="title" required></label><label>Video file link<input name="url" type="url"></label><button class="btn">Add video</button></form>${S.vids.map(v=>`<div class="row"><span>${esc(v.title)} <span class="tag ${v.rel?'ok':''}">${v.rel?'released':'hidden'}</span></span><span><button class="btn s" onclick="adminAct('rel',${v.id})">${v.rel?'Hide':'Release'}</button> <button class="btn s o" onclick="adminAct('dv',${v.id})">Delete</button></span></div>`).join('')}`;
if(tab==='sum')h=`<form onsubmit="addSum(event)"><label>Summary of today’s class (chats and videos)<textarea name="t" rows="4" required></textarea></label><button class="btn">Publish summary</button></form>${S.sums.map(s=>`<pre><b>${esc(s.d)}</b>\n${esc(s.t)}</pre>`).join('')}`;
if(tab==='pl')h=S.pledges.map(p=>`<div class="row"><span><b>${esc(p.name)}</b>, ${esc(p.email)}</span><span>${p.amt} ${p.cur} = ₦${p.ngn.toLocaleString()}</span></div>`).join('')||'<p>No pledges yet.</p>';
return `<section class="b"><div class="wrap"><h2>Admin panel</h2><div class="tabs">${tb.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('')}</div>${h}</div></section>`}};
function draw(){const r=location.hash.slice(1)||'home';if((r==='admin'&&me!=='admin')||(r==='student'&&(!me||me==='admin'))){location.hash='login';return}app.innerHTML=(R[r]||R.home)();document.getElementById('ft').innerHTML=`<b>Contact</b><br>Phone: ${esc(CFG.phone)}<br>WhatsApp: ${esc(CFG.whatsapp)}<br>Email: ${esc(CFG.email)}`}
function route(){draw();window.scrollTo(0,0)}
const go=h=>{location.hash=h;if(location.hash.slice(1)===h)route()};
function reg(e){const o=fd(e);o.id='a'+Date.now();o.status='pending';S.apps.push(o);save();document.getElementById('rm').innerHTML='<p class="note">Registration received. Wait for an email or WhatsApp message from the admin confirming your admission.</p>';e.target.reset()}
function np(){const f=document.getElementById('sp'),v=+f.amt.value||0;document.getElementById('ngn').textContent=`≈ ₦${Math.round(v*CFG.rates[f.cur.value]).toLocaleString()} (rate: ₦${CFG.rates[f.cur.value]} per ${f.cur.value})`}
function pledge(e){const o=fd(e);o.amt=+o.amt;o.ngn=Math.round(o.amt*CFG.rates[o.cur]);S.pledges.push(o);save();document.getElementById('pm').innerHTML=`<p class="note">Thank you, ${esc(o.name)}. Your pledge of ${o.amt} ${o.cur} (₦${o.ngn.toLocaleString()}) is recorded.</p>${CFG.payLink?`<a class="btn" href="${esc(CFG.payLink)}" target="_blank" rel="noopener">Complete payment</a>`:'<p>The payment button will appear here once a payment provider is connected.</p>'}`}
function login(e){const o=fd(e),m=document.getElementById('lm');if(o.role==='a'){if(o.code===CFG.adminCode){me='admin';go('admin')}else m.innerHTML='<p class="note">That admin code is not correct.</p>'}else{const a=adm().find(x=>x.email.toLowerCase()===(o.email||'').toLowerCase());if(a){me=a.id;go('student')}else m.innerHTML='<p class="note">No admitted account for this email yet. Register first, then wait for admission.</p>'}}
function adminAct(k,id){if(k==='admit'){S.apps.find(a=>a.id===id).status='admitted'}if(k==='rem')S.apps=S.apps.filter(a=>a.id!==id);if(k==='day')S.held.push({id:Date.now(),at:new Date().toISOString()});if(k==='rel'){const v=S.vids.find(v=>v.id===id);v.rel=!v.rel}if(k==='dv')S.vids=S.vids.filter(v=>v.id!==id);save();draw()}
function setCls(e){const o=fd(e);S.cls={at:new Date(o.at).toISOString(),link:o.link};save();draw()}
function mark(h,t,c){S.att[h]=S.att[h]||{};S.att[h][t]=c;save();draw()}
function addVid(e){const o=fd(e);S.vids.push({id:Date.now(),title:o.title,url:o.url,rel:false});save();draw()}
function addSum(e){const o=fd(e);S.sums.unshift({d:new Date().toDateString(),t:o.t});save();draw()}
addEventListener('hashchange',route);route();
</script></body></html>
